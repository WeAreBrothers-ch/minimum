<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcdedf"/><stop offset=".45" stop-color="#bfd9cf"/><stop offset=".62" stop-color="#e3dfd0"/>
    </linearGradient>
    <linearGradient id="bleu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fa1de" stop-opacity="0"/><stop offset="1" stop-color="#6fa1de" stop-opacity=".85"/>
    </linearGradient>
    <filter id="flou" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="flou-fin" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .45  0 0 0 0 .45  0 0 0 .55 0"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#ciel)"/>
  <rect x="900" width="700" height="700" fill="url(#bleu)" filter="url(#flou)"/>
  <ellipse cx="520" cy="420" rx="520" ry="90" fill="#f6f4ee" opacity=".7" filter="url(#flou)"/>
  <rect y="600" width="1600" height="400" fill="#d9c79a"/>
  <ellipse cx="450" cy="690" rx="640" ry="95" fill="#e8dcb8" filter="url(#flou)"/>
  <ellipse cx="1180" cy="650" rx="420" ry="64" fill="#9fc9b4" filter="url(#flou-fin)"/>
  <g fill="#1a2418" filter="url(#flou-fin)">
    <ellipse cx="1260" cy="640" rx="230" ry="46"/><ellipse cx="1480" cy="690" rx="190" ry="80"/>
    <ellipse cx="1330" cy="780" rx="260" ry="70"/><ellipse cx="1500" cy="880" rx="210" ry="90"/>
  </g>
  <g fill="#4d7a45" opacity=".8" filter="url(#flou-fin)">
    <ellipse cx="1240" cy="720" rx="150" ry="30"/><ellipse cx="1420" cy="830" rx="140" ry="28"/>
  </g>
  <ellipse cx="520" cy="890" rx="360" ry="70" fill="#c3d8d2" opacity=".8" filter="url(#flou)"/>
  <ellipse cx="260" cy="800" rx="150" ry="32" fill="#66765a" opacity=".7" filter="url(#flou-fin)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
