<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="fond" cx=".5" cy=".45" r=".75"><stop offset="0" stop-color="#f4f1e8"/><stop offset="1" stop-color="#b8b6ae"/></radialGradient>
    <linearGradient id="faisceau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="flou" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="2"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .7 0"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#fond)"/>
  <polygon points="-40,-40 120,-40 1700,880 1500,1100" fill="url(#faisceau)" opacity=".7" filter="url(#flou)"/>
  <rect x="520" y="250" width="620" height="390" fill="#161512" opacity=".92"/>
  <rect x="540" y="270" width="580" height="350" fill="#f1ede0" filter="url(#flou)" opacity=".9"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
